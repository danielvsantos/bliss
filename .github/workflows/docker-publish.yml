name: Publish Docker Images

on:
  push:
    branches: [main]

# Least privilege (#78 R13): every job only reads the repository.
permissions:
  contents: read

jobs:
  publish:
    name: Build & Push — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: danielvsantos/bliss-api
            dockerfile: docker/Dockerfile.api
          - image: danielvsantos/bliss-backend
            dockerfile: docker/Dockerfile.backend
          - image: danielvsantos/bliss-web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      # Third-party actions holding the Docker Hub token are pinned by commit
      # SHA (#78 R13); a moved tag can't change what runs.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:latest
