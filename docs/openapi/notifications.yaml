openapi: 3.0.3
info:
  title: Bliss API Layer - Notifications
  description: |
    Notification summary endpoints. Aggregates actionable signals from existing
    tables (no dedicated notification table) and provides read-tracking via
    User.lastNotificationSeenAt.
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bliss_<prefix>_<secret>
      description: >
        Integration token for AI agents, scripts and other systems, created by a
        tenant admin in Settings → Integrations (see integrations.yaml). It acts
        on behalf of the admin who created it, with a capped role: Read-only
        tokens may only GET, Read & write tokens act as a member, and a token is
        never admin. Some routes refuse tokens entirely with
        403 NOT_AVAILABLE_TO_INTEGRATIONS (sessions, users, integrations, the
        Plaid connection lifecycle, and account/category/tenant writes).
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HttpOnly JWT cookie set at sign-in.

  schemas:
    NotificationSignal:
      type: object
      properties:
        type:
          type: string
          description: Signal type identifier.
          enum:
            - PENDING_REVIEW
            - PLAID_ACTION_REQUIRED
            - ONBOARDING_INCOMPLETE
            - NEW_INSIGHTS
            - PLAID_CLASSIFICATION_FAILED
            - PROCESSING_FAILED
          example: "PENDING_REVIEW"
        count:
          type: integer
          description: Number of items in this signal.
          example: 3
        label:
          type: string
          description: Human-readable label for display.
          example: "transactions awaiting review"
        href:
          type: string
          nullable: true
          description: >
            Frontend route to navigate to. null = label only (PROCESSING_FAILED
            for non-admin roles).
          example: "/agents/review"
        severity:
          type: string
          description: Color hint for the frontend.
          enum: [positive, warning, info]
          example: "warning"
        isNew:
          type: boolean
          description: |
            Whether this signal contributes to totalUnseen. Actionable signals
            (PENDING_REVIEW, PLAID_ACTION_REQUIRED) are always true. Onboarding
            is always false. Insights are true if created after lastSeenAt.
          example: true

    NotificationSummaryResponse:
      type: object
      properties:
        totalUnseen:
          type: integer
          description: Sum of counts for signals where isNew is true.
          example: 5
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When the user last opened the notification center.
        signals:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSignal'

    Error:
      type: object
      properties:
        error:
          type: string

security:
  - CookieAuth: []
  - bearerAuth: []

paths:
  /api/notifications/summary:
    get:
      tags:
        - Notifications
      summary: Get notification summary
      description: |
        Aggregates 4 signal types from existing tables in parallel:
        - PENDING_REVIEW: PlaidTransaction (CLASSIFIED) + StagedImportRow (PENDING)
        - PLAID_ACTION_REQUIRED: PlaidItem (LOGIN_REQUIRED/ERROR)
        - ONBOARDING_INCOMPLETE: Tenant.onboardingProgress
        - NEW_INSIGHTS: Insight (created after lastSeenAt, not dismissed)
        - PLAID_CLASSIFICATION_FAILED: PlaidTransaction (FAILED)
        - PROCESSING_FAILED (#100): background jobs that failed on their final
          attempt since lastSeenAt, read from the processing-status hash in
          Redis (see activity.yaml). Links admins to /settings?tab=processing;
          href is null for other roles.

        No dedicated notification table is used.
      responses:
        '200':
          description: Aggregated notification summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSummaryResponse'
        '401':
          description: Unauthorized — missing or invalid JWT.

    put:
      tags:
        - Notifications
      summary: Mark notifications as seen
      description: |
        Updates User.lastNotificationSeenAt to the current timestamp.
        Used by the frontend to reset the unseen badge count when the
        notification popover is opened.
      responses:
        '200':
          description: Notifications marked as seen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized — missing or invalid JWT.
