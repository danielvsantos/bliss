openapi: 3.0.0
info:
  title: Bliss API Layer - Subscriptions
  version: 1.0.0
  description: >
    Detected recurring charges (subscriptions), one row per merchant per tenant.
    Detection runs in the backend subscriptionDetectionWorker; this API only
    reads the results and records user corrections. All endpoints require JWT
    authentication and are scoped to the caller's tenant.

servers:
  - url: /

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    SubscriptionItem:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        descriptionHash: { type: string, description: SHA-256 of the normalized merchant key }
        merchantLabel: { type: string }
        categoryId: { type: integer }
        category:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            icon: { type: string, nullable: true }
        state: { type: string, enum: [DETECTED, CONFIRMED, DISMISSED] }
        cadence: { type: string, nullable: true, enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUAL] }
        userCadenceLocked: { type: boolean }
        userLabelLocked: { type: boolean, description: true once the user renamed the charge; detector stops overwriting merchantLabel }
        status: { type: string, enum: [ACTIVE, LAPSED] }
        detectionReason:
          type: string
          nullable: true
          enum: [CATEGORY_SIGNAL, INTERVAL_HEURISTIC, USER_CONFIRMED]
        amount: { type: number, nullable: true, description: Median native amount }
        currency: { type: string, nullable: true }
        amountInDisplayCurrency: { type: number, nullable: true }
        monthlyAmount: { type: number, nullable: true, description: amountInDisplayCurrency × cadence factor }
        fxUnavailable: { type: boolean }
        occurrenceCount: { type: integer }
        firstChargedAt: { type: string, format: date-time, nullable: true }
        lastChargedAt: { type: string, format: date-time, nullable: true }
        nextExpectedAt: { type: string, format: date-time, nullable: true }
        lastDetectedAt: { type: string, format: date-time, nullable: true }
        contributingTransactionIds:
          type: array
          items: { type: integer }
        mergedIntoHash:
          type: string
          nullable: true
          description: >
            Non-null → this row is a manual-merge tombstone whose charges are
            folded into the target merchant. Only surfaces under view=all.
        mergedIntoLabel:
          type: string
          nullable: true
          description: merchantLabel of the merge target, resolved for display
        mergeTargetMissing:
          type: boolean
          description: >
            true when this tombstone's merge target row no longer exists — the UI
            shows a distinct "target missing" state instead of a label.
        mergeStale:
          type: boolean
          description: >
            true when this row is a merge target whose updatedAt predates the
            tenant's most recent lastDetectedAt — a guard-rail that a merge is not
            folding (should never fire once chargeKey reconciliation is live).
    SubscriptionsResponse:
      type: object
      properties:
        displayCurrency: { type: string }
        lastDetectedAt: { type: string, format: date-time, nullable: true }
        fullScanAt: { type: string, format: date-time, nullable: true }
        refreshCooldownSeconds: { type: integer }
        page: { type: integer, description: 1-based page of `items` }
        limit: { type: integer, description: page size (default 25, max 100) }
        total: { type: integer, description: total rows in the full filtered set }
        totalPages: { type: integer }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              icon: { type: string, nullable: true }
              count: { type: integer }
        mergeCandidates:
          type: array
          description: >
            Every non-dismissed, non-merged row for the tenant, independent of the
            view/category filter — the merge picker's target list.
          items:
            type: object
            properties:
              descriptionHash: { type: string }
              merchantLabel: { type: string }
              status: { type: string, enum: [ACTIVE, LAPSED] }
              state: { type: string, enum: [DETECTED, CONFIRMED, DISMISSED] }
              categoryIcon: { type: string, nullable: true }
              categoryName: { type: string, nullable: true }
        summary:
          type: object
          description: Recurring-spend summary — computed over the full filtered set, not just the returned page.
          properties:
            monthlyTotal: { type: number }
            annualTotal: { type: number }
            activeCount: { type: integer }
            lapsedCount: { type: integer }
            fxUnavailableCount: { type: integer }
            mergedCount: { type: integer, description: rows folded into another subscription — Unmerge lives under view=all }
        items:
          type: array
          description: One page (`limit`) of rows, ordered DETECTED → CONFIRMED → DISMISSED, then ACTIVE → LAPSED, then lastChargedAt desc.
          items: { $ref: '#/components/schemas/SubscriptionItem' }
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: string }

security:
  - cookieAuth: []

paths:
  /api/subscriptions:
    get:
      summary: List detected recurring charges + spend summary
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [active, lapsed, all], default: active }
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionsResponse' }
        '401': { description: Unauthenticated }
    post:
      summary: Record a user correction or trigger detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [confirm, dismiss, restore, setCadence, rename, merge, unmerge, refresh, fullScan]
                descriptionHash: { type: string }
                transactionId: { type: integer }
                cadence: { type: string, enum: [WEEKLY, MONTHLY, QUARTERLY, ANNUAL] }
                merchantLabel: { type: string, maxLength: 140, description: rename action — the new display name }
                sourceDescriptionHash: { type: string, description: merge action — the row to fold away }
                targetDescriptionHash: { type: string, description: merge action — the row to keep }
      description: >
        `merge` repoints the source row's durable `chargeKey` to the target's, so
        the detector folds by stored identity on the next run (bare, band or
        confirm-from-transaction rows alike). `confirm` by transactionId stamps
        the new row with a `chargeKey`.
      responses:
        '200': { description: Applied (confirm/dismiss/restore/setCadence/rename/merge/unmerge) }
        '201': { description: Provisional row created (confirm by transactionId) }
        '202': { description: Detection scan enqueued (refresh/fullScan) }
        '400':
          description: Invalid action or payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { description: No matching recurring charge }
        '409':
          description: >
            dismiss of a merge target that still has rows folded into it —
            body `code` is `MERGE_TARGET_HAS_DEPENDENTS`. Unmerge first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [MERGE_TARGET_HAS_DEPENDENTS] }
        '429':
          description: Scan cooldown active (refresh only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  retryAfter: { type: integer, description: seconds }
