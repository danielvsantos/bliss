openapi: 3.0.0
info:
  title: Bliss API Layer - Portfolio
  version: 1.0.0

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        HttpOnly session cookie set by the API at sign-in/sign-up.
        Sent automatically by the browser on all credentialed requests.
  schemas:
    FinancialSummary:
      type: object
      description: Aggregated financial metrics for a portfolio item in a specific currency.
      properties:
        costBasis:
          type: number
        marketValue:
          type: number
        unrealizedPnL:
          type: number
        unrealizedPnLPercent:
          type: number
        realizedPnL:
          type: number
        totalInvested:
          type: number

    PortfolioItem:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        name:
          type: string
        accountId:
          type: integer
          nullable: true
          description: >
            The brokerage account this item belongs to.
            null for manually-entered assets (real estate, private equity, etc.)
            that have no brokerage binding.
        hasLotMismatch:
          type: boolean
          description: >
            Set to true when FIFO lot processing produces a negative quantity,
            indicating a sell transaction with no matching buy in this account
            (e.g. a cross-account transfer recorded as a close). Surfaced as a
            data-quality warning in the transaction form.
        quantity:
          type: number
        currency:
          type: string
        isin:
          type: string
          nullable: true
          description: System-resolved ISIN (e.g. "IE00BK5BQT80").
        exchange:
          type: string
          nullable: true
          description: ISO-10383 MIC code (e.g. "XETR").
        assetCurrency:
          type: string
          nullable: true
          description: Currency the asset trades in (e.g. "EUR").
        category:
          type: object
          properties:
            name:
              type: string
            group:
              type: string
            type:
              type: string
            icon:
              type: string
            processingHint:
              type: string
        native:
          $ref: '#/components/schemas/FinancialSummary'
        usd:
          $ref: '#/components/schemas/FinancialSummary'
        portfolio:
          $ref: '#/components/schemas/FinancialSummary'
          description: Values in the tenant's configured portfolioCurrency.
        debtTerms:
          $ref: '#/components/schemas/DebtTerms'
        manualValues:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              date:
                type: string
                format: date
              value:
                type: number
              currency:
                type: string

    PortfolioItemsResponse:
      type: object
      properties:
        portfolioCurrency:
          type: string
          description: The tenant's configured portfolio display currency.
          example: 'EUR'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioItem'

    DebtTerms:
      type: object
      properties:
        id:
          type: integer
        portfolioItemId:
          type: integer
        initialBalance:
          type: number
          description: The original loan principal amount.
        interestRate:
          type: number
          description: Annual percentage rate (APR).
        termInMonths:
          type: integer
          description: Total loan term in months.
        originationDate:
          type: string
          format: date
          description: The date the loan was originated.

    DebtTermsInput:
      type: object
      required:
        - initialBalance
        - interestRate
        - termInMonths
        - originationDate
      properties:
        initialBalance:
          type: number
        interestRate:
          type: number
        termInMonths:
          type: integer
        originationDate:
          type: string
          format: date

    ManualAssetValue:
      type: object
      description: A single hand-entered price point for a manually-tracked asset.
      properties:
        id:
          type: string
          description: cuid identifier.
        date:
          type: string
          format: date
          description: The effective date the price applies to (may be backdated).
        value:
          type: number
          description: The price, serialized from a Prisma Decimal (string in JSON).
        currency:
          type: string
          description: >-
            ISO 4217 code stored per row. New rows are pinned to the asset
            currency; historical or imported rows may differ.
        notes:
          type: string
          description: Optional free-text note (e.g. valuation source).
        createdAt:
          type: string
          format: date-time
          description: When the row was keyed in (distinguishes a backdated entry).
        updatedAt:
          type: string
          format: date-time

    ManagedAsset:
      type: object
      description: One row of the Manage Assets list (#81). Stored values only — no live pricing, no manual-value history.
      properties:
        id: { type: integer }
        symbol: { type: string }
        displayName: { type: string, description: SecurityMaster name for listed securities, otherwise the symbol. }
        categoryName: { type: string, nullable: true }
        categoryType: { type: string, nullable: true, example: Investments }
        group: { type: string, nullable: true, example: Stocks }
        processingHint: { type: string, nullable: true, example: MANUAL }
        accountId: { type: integer, nullable: true }
        accountName: { type: string, nullable: true }
        currency: { type: string, example: EUR }
        quantity: { type: string, description: Decimal as string. }
        currentValue: { type: string, nullable: true, description: Stored value in the item currency (Decimal as string). }
        currentValueInDisplay: { type: number, nullable: true, description: Stored value in the portfolio currency. }
        lastManualValueDate: { type: string, format: date-time, nullable: true }
        assetClass:
          type: string
          enum: [STOCK, INDEX_ETF, SECTOR_ETF, BOND_ETF, REIT, FUND, GOV_BOND, CORP_BOND, REAL_ESTATE, CRYPTO, CASH, OTHER]
        assetClassSource: { type: string, enum: [AUTO, OVERRIDE] }
        incomeAssetClass:
          type: string
          nullable: true
          enum: [STOCK, ETF, FUND, BOND, REAL_ESTATE, CASH, OTHER]
          description: Passive income class; null when the item cannot hold income terms.
        hasLotMismatch: { type: boolean }
        hasIncomeTerms: { type: boolean }
        hasDividendOverride: { type: boolean }
        hasDebtTerms: { type: boolean }
        debtTermsMissing: { type: boolean, description: An amortizing loan with no debt terms. }
        needsAttention: { type: boolean, description: "Any action status: stale price, debt or income terms missing, lot mismatch." }
        isPriceStale: { type: boolean, description: "MANUAL item with quantity > 0 and no manual value in 30+ days (or none)." }
        incomeDataStatus:
          type: string
          enum: [AUTO, OVERRIDE, MANUAL, MISSING, NONE, NOT_APPLICABLE]
    ManageAssetsResponse:
      type: object
      properties:
        portfolioCurrency: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ManagedAsset' }
        nextCursor: { type: string, nullable: true, description: Opaque; null on the last page. }
        totals:
          type: object
          properties:
            count: { type: integer, description: Rows matching the filters across all pages. }
            attention: { type: integer, description: Rows with needsAttention, over the filters but ignoring `status`. }
        statusCounts:
          type: object
          description: Rows per status over the current filters, ignoring the `status` filter.
          properties:
            stale: { type: integer }
            debtTermsMissing: { type: integer }
            incomeMissing: { type: integer }
            lotMismatch: { type: integer }
            dividendOverride: { type: integer }
            assetClassOverridden: { type: integer }
        detachedTermsCount: { type: integer }
        facets:
          type: object
          description: First page only — filter options from the unfiltered list.
          properties:
            groups:
              type: array
              items:
                type: object
                properties:
                  group: { type: string }
                  count: { type: integer }
            accounts:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }

security:
  - cookieAuth: []

paths:
  /api/portfolio/assets:
    get:
      summary: Manage Assets list
      description: >
        Every portfolio item in one lightweight, server-filtered, paginated list
        (Manage Assets, #81). Stored values only — no live pricing and no
        manual-value history (one grouped max(date) per page). Sorted by
        (category group, symbol, id); the cursor is an opaque offset into that order.
      parameters:
        - name: type
          in: query
          description: A processingHint (upper snake case, e.g. MANUAL) or a category group (e.g. Real Estate).
          schema: { type: string }
        - name: accountId
          in: query
          schema: { type: integer }
        - name: assetClass
          in: query
          schema:
            type: string
            enum: [STOCK, INDEX_ETF, SECTOR_ETF, BOND_ETF, REIT, FUND, GOV_BOND, CORP_BOND, REAL_ESTATE, CRYPTO, CASH, OTHER]
        - name: search
          in: query
          description: Case-insensitive match on symbol or SecurityMaster name.
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [stale, debtTermsMissing, incomeMissing, lotMismatch, dividendOverride, assetClassOverridden]
        - name: sort
          in: query
          description: "`attention` (default) puts the most urgent rows first (critical/warning/stale price, debt terms missing, income terms missing, lot mismatch); `name` is A–Z by group and symbol."
          schema: { type: string, enum: [attention, name], default: attention }
        - name: includeClosed
          in: query
          description: Include items with quantity 0 (debts are always included).
          schema: { type: boolean, default: false }
        - name: id
          in: query
          description: Return only this item (deep links).
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
          description: Values above 100 are capped.
      responses:
        '200':
          description: One page of rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageAssetsResponse'
        '400':
          description: Invalid filter, cursor or limit.
        '405':
          description: Method not allowed.
        '500':
          description: Internal server error.
  /api/portfolio/items:
    get:
      summary: Fetch real-time portfolio items
      description: Retrieves a list of all portfolio items for the user, enriched with real-time market data where applicable.
      parameters:
        - name: assetType
          in: query
          description: Filter by the category type (e.g., 'Stock', 'Debt').
          schema:
            type: string
        - name: source
          in: query
          description: Filter by the data source of the item.
          schema:
            type: string
        - name: accountId
          in: query
          description: Filter by brokerage account ID.
          schema:
            type: string
        - name: countryId
          in: query
          description: Filter by the ISO country code of the brokerage account (e.g. "US", "GB"). Based on Account.countryId, not the equity's listed country.
          schema:
            type: string
      responses:
        '200':
          description: Portfolio items with currency metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItemsResponse'
  /api/portfolio/items/{assetId}/manual-values:
    get:
      summary: List manual values for an asset
      description: Retrieves all manual price entries for a given portfolio item.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >-
            An array of manual value entries, ordered by effective date
            descending (newest first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManualAssetValue'
        '404':
          description: Portfolio item not found.
    post:
      summary: Add a manual value to an asset
      description: Adds a new manual price point for a portfolio item that is tracked manually.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - value
                - currency
              properties:
                date:
                  type: string
                  format: date
                value:
                  type: number
                currency:
                  type: string
                notes:
                  type: string
                  description: Optional free-text note (e.g. valuation source).
      responses:
        '201':
          description: The newly created manual value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualAssetValue'
        '404':
          description: Portfolio item not found.

  /api/portfolio/items/{assetId}/manual-values/{valueId}:
    put:
      summary: Update a manual value entry
      description: >-
        Updates a specific manual price entry. Any subset of fields may be
        supplied. On success the backend emits `MANUAL_PORTFOLIO_PRICE_UPDATED`
        so the portfolio is revalued.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
        - name: valueId
          in: path
          required: true
          description: The manual value's id (cuid string).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                value:
                  type: number
                currency:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: The updated manual value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualAssetValue'
        '404':
          description: Portfolio item or manual value not found.
    delete:
      summary: Delete a manual value entry
      description: >-
        Removes a specific manual price entry from a portfolio item. On success
        the backend emits `MANUAL_PORTFOLIO_PRICE_UPDATED` so the portfolio is
        revalued.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
        - name: valueId
          in: path
          required: true
          description: The manual value's id (cuid string).
          schema:
            type: string
      responses:
        '204':
          description: Manual value deleted successfully.
        '404':
          description: Portfolio item or manual value not found.

  /api/portfolio/items/{assetId}/debt-terms:
    get:
      summary: Get debt terms for a liability
      description: Retrieves the loan/debt terms for a portfolio item classified as a liability.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The debt terms for the portfolio item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtTerms'
        '404':
          description: Portfolio item or debt terms not found.
    put:
      summary: Create or update debt terms
      description: Sets or updates the loan/debt terms for a portfolio item classified as a liability.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtTermsInput'
      responses:
        '200':
          description: Debt terms saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtTerms'
        '404':
          description: Portfolio item not found.
  /api/portfolio/holdings:
    get:
      summary: Fetch historical portfolio holdings
      description: Retrieves a paginated list of daily portfolio holdings records.
      parameters:
        - name: ticker
          in: query
          description: Filter by asset symbol.
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category name.
          schema:
            type: string
        - name: categoryGroup
          in: query
          description: Filter by category group.
          schema:
            type: string
        - name: account
          in: query
          description: Filter by brokerage account ID.
          schema:
            type: integer
        - name: countryId
          in: query
          description: Filter by the ISO country code of the brokerage account.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: A paginated list of portfolio holdings.
  /api/portfolio/history:
    get:
      summary: Fetch aggregated portfolio history
      description: Retrieves aggregated historical data for performance charting.
      parameters:
        - name: from
          in: query
          description: Start date in ISO 8601 format.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End date in ISO 8601 format.
          schema:
            type: string
            format: date
        - name: type
          in: query
          description: 'Filter by asset type (e.g., INVESTMENT, DEBT). Multiple values can be comma-separated.'
          schema:
            type: string
        - name: group
          in: query
          description: 'Filter by asset group (e.g., Equities, Real Estate). Multiple values can be comma-separated.'
          schema:
            type: string
        - name: accountId
          in: query
          description: Filter history to a single brokerage account.
          schema:
            type: integer
      responses:
        '200':
          description: A time-series of aggregated daily portfolio values with currency metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  portfolioCurrency:
                    type: string
                    description: The tenant's configured portfolio display currency.
                    example: 'EUR'
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        totalUSD:
                          type: number
                          description: Total portfolio value in USD.
                        totalPortfolioCurrency:
                          type: number
                          description: Total portfolio value in the tenant's portfolioCurrency.
                        Investments:
                          type: object
                          properties:
                            total:
                              type: number
                            groups:
                              type: object
                              additionalProperties:
                                type: number
                        Debt:
                          type: object
                          properties:
                            total:
                              type: number
                            groups:
                              type: object
                              additionalProperties:
                                type: number

  /api/portfolio/equity-analysis:
    get:
      summary: Fetch equity risk and composition analysis
      description: >
        Returns equity holdings grouped by sector, industry, or country,
        enriched with SecurityMaster fundamentals (P/E, dividend yield, EPS).
        Holdings for the same symbol held across multiple accounts are
        automatically merged so each ticker appears once.
      parameters:
        - name: groupBy
          in: query
          description: 'Dimension to group holdings by. Default: sector.'
          schema:
            type: string
            enum: [sector, industry, country]
            default: sector
        - name: accountId
          in: query
          description: Restrict analysis to a single brokerage account.
          schema:
            type: integer
      responses:
        '200':
          description: Equity analysis data grouped by the requested dimension.
          content:
            application/json:
              schema:
                type: object
                properties:
                  portfolioCurrency:
                    type: string
                  summary:
                    type: object
                    properties:
                      totalEquityValue:
                        type: number
                      holdingsCount:
                        type: integer
                      weightedPeRatio:
                        type: number
                        nullable: true
                      weightedDividendYield:
                        type: number
                        nullable: true
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        totalValue:
                          type: number
                        weight:
                          type: number
                        holdingsCount:
                          type: integer
                        holdings:
                          type: array
                          items:
                            type: object
                            properties:
                              symbol:
                                type: string
                              name:
                                type: string
                              quantity:
                                type: number
                              currentValue:
                                type: number
                              weight:
                                type: number
                              peRatio:
                                type: number
                                nullable: true
                              dividendYield:
                                type: number
                                nullable: true
                              trailingEps:
                                type: number
                                nullable: true
                              week52High:
                                type: number
                                nullable: true
                              week52Low:
                                type: number
                                nullable: true
