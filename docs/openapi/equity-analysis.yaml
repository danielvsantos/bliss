openapi: 3.0.0
info:
  title: Bliss API Layer - Equity Analysis
  version: 1.0.0

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        HttpOnly session cookie set by the API at sign-in/sign-up.
        Sent automatically by the browser on all credentialed requests.
  schemas:
    EquityHolding:
      type: object
      properties:
        symbol:
          type: string
          example: 'AAPL'
        name:
          type: string
          example: 'Apple Inc.'
        assetType:
          type: string
          enum: [STOCK, ETF]
          description: ETFs have "Diversified" as their own sector/industry/country and never carry P/E or EPS.
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        assetClassSource:
          type: string
          enum: [OVERRIDE, AUTO]
          description: OVERRIDE when the user set the asset class (PortfolioItem.assetClassOverride).
        autoAssetClass:
          $ref: '#/components/schemas/AssetClass'
        itemIds:
          type: array
          items:
            type: integer
          description: Portfolio item ids merged into this row (same symbol across accounts).
          example: [12, 31]
        composition:
          allOf:
            - $ref: '#/components/schemas/EtfComposition'
          nullable: true
          description: ETF composition (null for stocks and ETFs not fetched yet).
        quantity:
          type: number
          example: 50
        currentValue:
          type: number
          description: Market value in the portfolio currency.
          example: 8750.00
        currentValueUSD:
          type: number
          description: Market value in USD.
          example: 8750.00
        sector:
          type: string
          example: 'Technology'
        industry:
          type: string
          example: 'Consumer Electronics'
        country:
          type: string
          example: 'United States'
        peRatio:
          type: number
          nullable: true
          description: Computed price-to-earnings ratio.
          example: 28.5
        dividendYield:
          type: number
          nullable: true
          description: Computed annualized dividend yield (decimal, e.g. 0.0055 = 0.55%).
          example: 0.0055
        trailingEps:
          type: number
          nullable: true
          description: Trailing 4-quarter earnings per share.
          example: 6.14
        latestEpsActual:
          type: number
          nullable: true
          example: 1.53
        latestEpsSurprise:
          type: number
          nullable: true
          example: 4.2
        week52High:
          type: number
          nullable: true
          example: 199.62
        week52Low:
          type: number
          nullable: true
          example: 155.98
        averageVolume:
          type: number
          nullable: true
          example: 54320000
        logoUrl:
          type: string
          nullable: true
        weight:
          type: number
          description: Holding weight within total equity value (0-1).
          example: 0.058

    AssetClass:
      type: string
      description: >
        Asset class from the shared classifier (`classifyAssetClass` in
        `@bliss/shared/portfolio`).
      enum: [STOCK, INDEX_ETF, SECTOR_ETF, BOND_ETF, REIT, FUND, GOV_BOND, CORP_BOND, REAL_ESTATE, CRYPTO, CASH, OTHER]
      example: INDEX_ETF

    EtfComposition:
      type: object
      description: Weights are fractions (0.5915 = 59.15%). Refreshed weekly from Twelve Data /etfs/world/composition.
      properties:
        sectors:
          type: array
          items:
            type: object
            properties:
              sector: { type: string, example: 'Technology' }
              weight: { type: number, example: 0.5915 }
        countries:
          type: array
          items:
            type: object
            properties:
              country: { type: string, example: 'United States' }
              weight: { type: number, example: 0.62 }
        assetAllocation:
          type: object
          additionalProperties:
            type: number
          example: { stocks: 0.9995, bonds: 0, cash: 0.0005 }

    EquityGroup:
      type: object
      properties:
        name:
          type: string
          description: >
            Group name (sector, industry, country or asset class). Look-through
            buckets: `Diversified` (ETF without composition, industry view,
            toggle off), `Other` (share of an ETF not covered by its weights),
            `Fixed Income` (bond ETFs in the sector/country views).
          example: 'Technology'
        totalValue:
          type: number
          example: 75000.00
        weight:
          type: number
          description: Group weight within total equity value (0-1).
          example: 0.50
        holdingsCount:
          type: integer
          example: 5
        holdings:
          type: array
          description: Holdings contributing to the group. With look-through an ETF can appear in several groups.
          items:
            $ref: '#/components/schemas/EquityHolding'

    EquityAnalysisSummary:
      type: object
      properties:
        totalEquityValue:
          type: number
          example: 150000.00
        holdingsCount:
          type: integer
          example: 12
        weightedPeRatio:
          type: number
          nullable: true
          description: Holdings-weighted average P/E ratio.
          example: 22.5
        weightedDividendYield:
          type: number
          nullable: true
          description: Holdings-weighted average dividend yield (decimal).
          example: 0.018

    EquityAnalysisResponse:
      type: object
      properties:
        portfolioCurrency:
          type: string
          example: 'USD'
        summary:
          $ref: '#/components/schemas/EquityAnalysisSummary'
        lookThrough:
          type: boolean
          description: Whether sector and country groups look through ETFs.
        lookThroughAvailable:
          type: boolean
          description: >
            True when at least one ETF holding has composition data. When false
            (e.g. the Twelve Data plan doesn't include /etfs/world/composition),
            look-through has no effect and the web hides its switch.
        groups:
          type: array
          description: Groups for the requested `groupBy`.
          items:
            $ref: '#/components/schemas/EquityGroup'
        groupings:
          type: object
          description: Groups for every dimension, so the client can switch without refetching.
          properties:
            sector: { type: array, items: { $ref: '#/components/schemas/EquityGroup' } }
            industry: { type: array, items: { $ref: '#/components/schemas/EquityGroup' } }
            country: { type: array, items: { $ref: '#/components/schemas/EquityGroup' } }
            assetClass: { type: array, items: { $ref: '#/components/schemas/EquityGroup' } }
        holdings:
          type: array
          description: Every equity holding once, largest first. Render rows from this list.
          items:
            $ref: '#/components/schemas/EquityHolding'

paths:
  /api/portfolio/equity-analysis:
    get:
      tags:
        - Portfolio
      summary: Get equity portfolio analysis
      description: >
        Returns stock and ETF portfolio composition enriched with fundamental data
        from the SecurityMaster reference table. Holdings are grouped by the
        requested dimension (sector, industry, country or asset class) with
        weighted aggregate metrics. ETFs (API_FUND items whose SecurityMaster
        assetType is `ETF`) never carry P/E or EPS — weighted P/E stays
        stock-only. With `lookThrough` (default) the sector and country groups
        spread each ETF's value by its composition weights (remainder →
        `Other`; no composition or empty country list → `Diversified`; bond
        ETFs → `Fixed Income`); industry never looks through. Holdings are
        listed once each. Dividend yield honours a user dividend override
        (IncomeTerms) and "doesn't distribute". Stocks and ETFs only: the
        all-investment breakdown lives on the Portfolio page and bonds on
        Passive Income.
      security:
        - cookieAuth: []
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [sector, industry, country, assetClass]
            default: sector
          description: Dimension returned in `groups` (every dimension is in `groupings`).
        - name: lookThrough
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
          description: '`false` shows every ETF as one `Diversified` bucket (pre-#79 behaviour).'
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
          description: Restrict to one account.
      responses:
        '200':
          description: Equity analysis data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityAnalysisResponse'
        '400':
          description: Invalid groupBy parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid groupBy value. Must be one of: sector, industry, country, assetClass'
        '405':
          description: Method not allowed.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Server Error'

  /api/portfolio/items/{assetId}/asset-class:
    get:
      tags:
        - Portfolio
      summary: Get a holding's asset class
      description: Current class, its source and the automatic class (Manage Assets asset class modal, #81).
      security:
        - cookieAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The item's classification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetClass:
                    $ref: '#/components/schemas/AssetClass'
                  assetClassSource:
                    type: string
                    enum: [OVERRIDE, AUTO]
                  autoAssetClass:
                    $ref: '#/components/schemas/AssetClass'
        '400':
          description: Invalid id.
        '404':
          description: Portfolio item not found in this tenant.
        '500':
          description: Internal server error.
    put:
      tags:
        - Portfolio
      summary: Set or clear a holding's asset class override
      description: >
        Stores `PortfolioItem.assetClassOverride` (Equity Analysis #79). `null`
        clears it (back to automatic). With `applyToSymbol: true` the override
        is set on every holding of the same symbol in the tenant (Equity
        Analysis merges those into one row). No background job — Equity
        Analysis classifies on read. A portfolio rebuild that re-keys the item
        carries the override to the replacement item.
      security:
        - cookieAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetClass]
              properties:
                assetClass:
                  allOf:
                    - $ref: '#/components/schemas/AssetClass'
                  nullable: true
                applyToSymbol:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Override saved; returns the recomputed class.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetClass:
                    $ref: '#/components/schemas/AssetClass'
                  assetClassSource:
                    type: string
                    enum: [OVERRIDE, AUTO]
                  autoAssetClass:
                    $ref: '#/components/schemas/AssetClass'
                  updatedCount:
                    type: integer
                    example: 1
        '400':
          description: Invalid id or asset class.
        '404':
          description: Portfolio item not found in this tenant.
        '405':
          description: Method not allowed.
        '500':
          description: Internal server error.
