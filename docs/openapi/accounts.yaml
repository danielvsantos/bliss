openapi: 3.0.0
info:
  title: Bliss API Layer - Accounts
  version: 1.0.1
  description: API for managing bank accounts within a tenant.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bliss_<prefix>_<secret>
      description: >
        Integration token for AI agents, scripts and other systems, created by a
        tenant admin in Settings → Integrations (see integrations.yaml). It acts
        on behalf of the admin who created it, with a capped role: Read-only
        tokens may only GET, Read & write tokens act as a member, and a token is
        never admin. Some routes refuse tokens entirely with
        403 NOT_AVAILABLE_TO_INTEGRATIONS (sessions, users, integrations, the
        Plaid connection lifecycle, and account/category/tenant writes).
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        HttpOnly session cookie set by the API at sign-in/sign-up.
        Sent automatically by the browser on all credentialed requests.
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        accountNumber:
          type: string
        bankId:
          type: integer
        currencyCode:
          type: string
        countryId:
          type: string
        ownerIds:
          type: array
          items:
            type: string
    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        accountNumber:
          type: string
        bankId:
          type: integer
        currencyCode:
          type: string
        countryId:
          type: string
        ownerIds:
          type: array
          items:
            type: string
    AccountList:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/accounts:
    get:
      summary: Get accounts
      description: Retrieves a list of accounts, with optional filtering and pagination.
      operationId: getAccounts
      parameters:
        - name: id
          in: query
          description: Account ID to fetch a single account.
          schema:
            type: integer
        - name: countryId
          in: query
          description: Filter by country ID.
          schema:
            type: string
        - name: currencyCode
          in: query
          description: Filter by currency code.
          schema:
            type: string
        - name: ownerId
          in: query
          description: Filter by owner's user ID.
          schema:
            type: string
        - name: page
          in: query
          description: Page number for pagination.
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page.
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A list of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
    post:
      summary: Create an account
      description: >
        Creates a new manual account. `name`, `accountNumber`, `bankId`,
        `currencyCode` and `countryId` are required; the bank must be linked to
        the tenant and the currency and country enabled for it. `ownerIds` is
        optional and defaults to the acting user (for an integration token, the
        admin who created it). Reachable by Read & write integration tokens
        (#98); `PUT`/`DELETE` are not. The response never contains the full
        account number (`accountNumberLast4` instead), and each owner's `user`
        is reduced to `{ id, email }`.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, accountNumber, bankId, currencyCode, countryId]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed before saving.
                accountNumber:
                  type: string
                  description: Stored encrypted; never returned by this endpoint.
                bankId:
                  type: integer
                currencyCode:
                  type: string
                  example: EUR
                countryId:
                  type: string
                  description: ISO 3166 alpha-3 code.
                  example: DEU
                ownerIds:
                  type: array
                  items:
                    type: string
                  description: Defaults to the acting user when omitted.
      responses:
        '201':
          description: Account created. Same shape as `Account`, without `accountNumber` and with `accountNumberLast4`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: >
            Missing required fields, invalid `bankId`, a bank/currency/country not
            available for the tenant (`details` keyed by `bankId` / `currency` /
            `country`), or owner IDs outside the tenant.
        '403':
          description: Read-only integration token (`READ_ONLY_INTEGRATION`).
        '409':
          description: >
            Integration callers only: an account with the same bank, currency and
            name (case-insensitive) already exists.
            Body `{ error: "ACCOUNT_EXISTS", code: "ACCOUNT_EXISTS", accountId, details: { accountId } }`.

  /api/accounts/{id}:
    put:
      summary: Update an account
      description: Updates an existing account by its ID.
      operationId: updateAccount
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the account to update.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    delete:
      summary: Delete an account
      description: Deletes an account by its ID.
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the account to delete.
          schema:
            type: integer
      responses:
        '204':
          description: Account deleted.
