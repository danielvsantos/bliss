openapi: 3.0.3
info:
  title: Bliss API Layer - Banks
  version: 1.1.0
  description: >
    Tenant-scoped bank management. All endpoints require JWT authentication.
    Banks are globally shared records linked to tenants via the TenantBank join table.

security:
  - cookieAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bliss_<prefix>_<secret>
      description: >
        Integration token for AI agents, scripts and other systems, created by a
        tenant admin in Settings → Integrations (see integrations.yaml). It acts
        on behalf of the admin who created it, with a capped role: Read-only
        tokens may only GET, Read & write tokens act as a member, and a token is
        never admin. Some routes refuse tokens entirely with
        403 NOT_AVAILABLE_TO_INTEGRATIONS (sessions, users, integrations, the
        Plaid connection lifecycle, and account/category/tenant writes).
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HttpOnly session cookie set at sign-in.
  schemas:
    Bank:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        institutionId:
          type: string
          nullable: true
          description: Plaid institution ID (ins_*) for auto-matching. Null for manual banks.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BankCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Display name of the bank. Trimmed before storage.
    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /api/banks:
    get:
      summary: List all banks
      description: >
        Returns the full global list of banks, ordered alphabetically by name.
        Banks are reference data (like countries and currencies) — all users
        see the same list. Tenant-specific bank selection is managed via the
        TenantBank join table through the tenants API.
      tags:
        - Banks
      responses:
        '200':
          description: A list of all available banks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bank'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create or link a bank
      description: >
        Creates a new bank or links an existing one to the tenant. Idempotent.
        If a bank with the given name already exists globally (case-insensitive,
        exact casing preferred), it is reused; otherwise a new Bank record is
        created. The TenantBank link is created when missing. Responds `201`
        when this call linked the bank to the tenant and `200` when it was
        already linked (#98: MCP `create_bank` reports this as `created`).
        Reachable by Read & write integration tokens.
      tags:
        - Banks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankCreateRequest'
      responses:
        '201':
          description: Bank created and/or newly linked to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bank'
        '200':
          description: The bank was already linked to the tenant; the existing bank is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bank'
        '400':
          description: Invalid input (name too short/long or missing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
