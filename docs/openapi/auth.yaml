openapi: 3.0.0
info:
  title: Bliss API Layer - Authentication
  version: 1.0.0
  description: API endpoints for user authentication, registration, and session management.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        HttpOnly access cookie (15-minute JWT, Path=/) set by /api/auth/signin,
        /api/auth/signup, /api/auth/google-token, /api/auth/refresh and
        /api/auth/reauth. Automatically sent by the browser on all credentialed
        requests (withCredentials: true). Claims: jti, userId, tenantId, email,
        auth_time (the real sign-in, epoch s) and iat_ms (#156).
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: bliss_rt
      description: >
        HttpOnly refresh cookie (#156), `<sessionId>.<secret>`, scoped to
        Path=/api/auth with the same SameSite/Secure/Domain rules as `token`.
        Set together with the access cookie on every sign-in; rotated on every
        refresh. Max-Age follows the 7-day idle timeout, capped at the 15-day
        absolute session expiry. Only its SHA-256 hash is stored.

  schemas:
    SignupInviteRequiredError:
      type: object
      properties:
        error:
          type: string
          example: 'Sign-up on this instance is by invitation only.'
        code:
          type: string
          enum: [SIGNUP_INVITE_REQUIRED]
    User:
      type: object
      properties:
        id:
          type: string
          example: 'clx...'
        email:
          type: string
          format: email
        name:
          type: string
        profilePictureUrl:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum: [admin, member]
          default: member
          description: >
            The user's role within their tenant. 'admin' is assigned to the tenant owner
            (created via sign-up or first-time Google OAuth). 'member' is assigned to all
            invited users by default. Only admins may change a user's role.
        tenant:
          $ref: '#/components/schemas/Tenant'

    Tenant:
      type: object
      properties:
        id:
          type: string
          example: 'clx...'
        name:
          type: string
        plan:
          type: string
          enum: [FREE, PRO, AI]
        createdAt:
          type: string
          format: date-time

    SignUpRequest:
      type: object
      required:
        - email
        - password
        - tenantName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
        tenantName:
          type: string
        countries:
          type: array
          items:
            type: string
            example: 'USA'
        currencies:
          type: array
          items:
            type: string
            example: 'USD'
        bankIds:
          type: array
          items:
            type: integer
            example: 1

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: The user's current password.
        newPassword:
          type: string
          format: password
          minLength: 8
          description: The new password (minimum 8 characters).
        confirmPassword:
          type: string
          format: password
          description: Must match newPassword exactly.

    AuthSuccessResponse:
      type: object
      description: >
        Returned by /api/auth/signup and /api/auth/signin on success.
        The JWT is delivered exclusively via the Set-Cookie response header
        (HttpOnly cookie named `token`). It is NOT included in the response body.
      properties:
        user:
          $ref: '#/components/schemas/User'

    GoogleOAuthCallbackResponse:
      type: object
      description: >
        Delivered as a browser redirect (not JSON). The JWT is set as an HttpOnly cookie
        (Set-Cookie: token=<jwt>; HttpOnly; SameSite=Lax; Max-Age=86400; Path=/) before the
        redirect is issued. The redirect URL contains only the isNew flag:
        ${FRONTEND_URL}/auth/callback?isNew=<bool>.
      properties:
        isNew:
          type: boolean
          description: >
            `true` if the user account was just created (first-time Google user);
            `false` for returning users or existing accounts linked to Google.

# Apply Bearer Auth to all paths in this file by default
security:
  - cookieAuth: []

paths:
  /api/auth/signup:
    post:
      summary: Register a new user and tenant
      tags:
        - Authentication
      # This endpoint is public, so we override the global security
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Signup successful
          headers:
            Set-Cookie:
              description: >
                HttpOnly session cookie. Format: token=<jwt>; HttpOnly; SameSite=Lax; Max-Age=86400; Path=/.
                In production also includes Secure; Domain=<COOKIE_DOMAIN>.
              schema:
                type: string
                example: 'token=eyJhbGci...; HttpOnly; SameSite=Lax; Max-Age=86400; Path=/'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Bad Request (e.g., missing fields, invalid email)
        '403':
          description: >
            Invite-only mode (SIGNUP_MODE=invite_only, or any unknown value):
            the email has no unused sign-up invite. Checked before the
            existing-user check, so a registered email without an invite gets
            this exact response too (no account-existence oracle). The body is
            identical for every rejection and never echoes the email or list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupInviteRequiredError'
        '429':
          description: Too many sign-up attempts (rejected invite attempts count too).
        '500':
          description: Internal Server Error

  /api/auth/signup-mode:
    get:
      summary: Public sign-up mode flag
      description: >
        Tells the SPA whether this instance is invite-only so the auth page can
        show a notice on the Sign Up tab. Returns only `inviteOnly` (no counts,
        emails or environment details). Informational: the server enforces the
        gate on sign-up itself. Integration tokens are refused (403).
      tags:
        - Authentication
      security: []
      responses:
        '200':
          description: The current sign-up mode.
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=60'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [inviteOnly]
                properties:
                  inviteOnly:
                    type: boolean
                    example: true
        '405':
          description: Method Not Allowed (GET only)

  /api/auth/signin:
    post:
      summary: Sign in an existing user
      tags:
        - Authentication
      # This endpoint is public, so we override the global security
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signin successful
          headers:
            Set-Cookie:
              description: >
                HttpOnly session cookie. Format: token=<jwt>; HttpOnly; SameSite=Lax; Max-Age=86400; Path=/.
                In production also includes Secure; Domain=<COOKIE_DOMAIN>.
              schema:
                type: string
                example: 'token=eyJhbGci...; HttpOnly; SameSite=Lax; Max-Age=86400; Path=/'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Bad Request (e.g., missing fields, invalid email)
        '401':
          description: Unauthorized (invalid credentials)
        '500':
          description: Internal Server Error

  /api/auth/session:
    get:
      summary: Get current user session
      tags:
        - Authentication
      description: |
        Validates the session by reading the `token` HttpOnly cookie from the request.
        Does NOT accept an Authorization: Bearer header.
        Also checks the JWT denylist (Redis) via the `jti` claim — returns 401 if the
        token has been server-side revoked.
      # This endpoint is protected and will use the global security definition
      responses:
        '200':
          description: Session is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: >
            Unauthorized (token is missing, invalid, expired, or issued before
            the user's sessionsRevokedAt — code SESSION_REVOKED, #156). The SPA
            tries POST /api/auth/refresh before treating the user as signed out.
        '404':
          description: Not Found (user associated with token not found)
        '500':
          description: Internal Server Error

  /api/auth/signout:
    post:
      summary: Sign out the current user (stateful token revocation)
      tags:
        - Authentication
      description: |
        Actively revokes the caller's session server-side and clears both session cookies.

        Flow:
        1. Rejects a foreign `Origin` (or, without one, `Referer`) with 403 UNTRUSTED_ORIGIN.
        2. Decodes the `token` cookie (jwt.decode — works for an expired token too).
        3. Calls addToDenylist(jti, remainingTtl) — token is immediately invalid in Redis.
        4. Revokes this device's session family when the `bliss_rt` cookie matches it (#156).
        5. Clears `token` (Path=/) and `bliss_rt` (Path=/api/auth) with Max-Age=0.

        Succeeds without a session too (nothing to revoke; cookies are cleared).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Signed out. Cookies cleared, token and session revoked.
          headers:
            Set-Cookie:
              description: Clears both cookies (token=; Max-Age=0; Path=/ and bliss_rt=; Max-Age=0; Path=/api/auth).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Signed out successfully'
        '403':
          description: Untrusted request origin (code UNTRUSTED_ORIGIN, #156)
        '500':
          description: Internal Server Error

  /api/auth/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token (#156)
      tags:
        - Authentication
      description: |
        Authenticated by the `bliss_rt` cookie only. The SPA calls it when a
        request answers 401 (one in-flight call shared by concurrent 401s),
        then retries the request once.

        - Current token → rotated: new access + refresh cookies; the idle
          clock resets (never past the 15-day absolute expiry).
        - The token rotated within the last 10 s, from the same device → a new
          access cookie only (concurrent tabs).
        - The previous token from the same device after more than 10 s (a
          lost response) → rotated again.
        - Any other token of the family (reuse) → the whole family is revoked,
          both cookies are cleared, 401 SESSION_REVOKED.

        Origin-guarded. Rate limit: 60 per 5 minutes per IP. Integration keys
        are refused (NOT_AVAILABLE_TO_INTEGRATIONS).
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: Session refreshed
          headers:
            Set-Cookie:
              description: New `token` (Max-Age=900) and, on rotation, a new `bliss_rt`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: >
            No live session: SESSION_EXPIRED (no/malformed cookie, idle or
            absolute expiry, user gone) or SESSION_REVOKED (revoked or reused).
            Both cookies are cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [SESSION_EXPIRED, SESSION_REVOKED]
        '403':
          description: Untrusted request origin (UNTRUSTED_ORIGIN) or integration key
        '405':
          description: Method Not Allowed (only POST)
        '429':
          description: Too Many Requests

  /api/auth/reauth:
    get:
      summary: Recent sign-in status (#156)
      tags:
        - Authentication
      description: |
        Whether the session's real sign-in (`auth_time`) is within the last
        15 minutes — required to create an integration or a key and to approve
        an OAuth connection — and which methods can confirm it.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  recent:
                    type: boolean
                  methods:
                    type: array
                    items:
                      type: string
                      enum: [password, google]
        '401':
          description: Not signed in
    post:
      summary: Confirm identity with the password (#156)
      tags:
        - Authentication
      description: |
        Marks the session as freshly authenticated and issues a new access
        cookie. The 15-day session cap is unchanged. A wrong password never
        changes the session. Google accounts repeat Google sign-in instead
        (prompt=select_account), which bumps the same session in google-token.
        Origin-guarded; uses the sign-in rate limiter.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Confirmed (new access cookie)
        '400':
          description: NO_PASSWORD — the account has no password (use Google)
        '401':
          description: REAUTH_FAILED — wrong password (session left intact)
        '403':
          description: UNTRUSTED_ORIGIN, viewer, or integration key
        '429':
          description: Too Many Requests

  /api/auth/sessions/revoke-others:
    post:
      summary: Sign out of all other devices (#156)
      tags:
        - Authentication
      description: |
        Authenticated by the refresh cookie (every role, viewers included).
        Sets the user's sessionsRevokedAt and revokes every other session in
        one transaction: other devices get 401 on their next request. This
        device gets a fresh access cookie and stays signed in.
        Origin-guarded; 3 per 15 minutes.
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: Other sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
                    example: 2
        '401':
          description: SESSION_EXPIRED — no live session on this device
        '403':
          description: UNTRUSTED_ORIGIN or integration key
        '429':
          description: Too Many Requests

  /api/auth/change-password:
    put:
      summary: Change the authenticated user's password
      tags:
        - Authentication
      description: |
        Allows a credential-based user to update their password. The user must
        provide their current password for verification before the new password
        is accepted.

        **Not available for OAuth-only accounts** (users who signed up via Google
        and have no stored password hash).

        **Rate limit**: 3 attempts per 15-minute window.

        **Sessions (#156):** on success every other device is signed out on its
        next request (sessionsRevokedAt + every session revoked, in the same
        transaction as the new hash). This device receives new `token` and
        `bliss_rt` cookies and stays signed in. Origin-guarded
        (403 UNTRUSTED_ORIGIN).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Password updated successfully'
        '400':
          description: >
            Bad Request — missing fields, new password shorter than 8 characters,
            passwords do not match, or account does not support password change
            (OAuth-only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'New password must be at least 8 characters'
        '401':
          description: Unauthorized — current password is incorrect or session is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Current password is incorrect'
        '405':
          description: Method Not Allowed (only PUT is accepted)
        '429':
          description: Too Many Requests — rate limit exceeded (3 attempts per 15 min)
        '500':
          description: Internal Server Error

  /api/auth/csrf:
    get:
      summary: Retrieve CSRF token for NextAuth OAuth initiation
      tags:
        - Authentication (Google OAuth)
      description: |
        Returns a `csrfToken` string and sets the `next-auth.csrf-token` cookie on the API
        domain. This token is required before calling `POST /api/auth/signin/google`.

        Clients **must** pass `credentials: 'include'` (or equivalent) so the CSRF cookie is
        set cross-origin. This endpoint is served by the NextAuth v4 catch-all handler
        (`pages/api/auth/[...nextauth].js`) with a permissive `Access-Control-Allow-Origin`
        header pointing at `FRONTEND_URL`.
      security: []
      responses:
        '200':
          description: CSRF token retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken:
                    type: string
                    description: One-time CSRF token to be included in the OAuth form POST.
                    example: 'a3f8c2d1e4b7...'

  /api/auth/signin/google:
    post:
      summary: Initiate Google OAuth sign-in or sign-up
      tags:
        - Authentication (Google OAuth)
      description: |
        NextAuth v4 OAuth initiation endpoint. **Must be called as a form POST** (not JSON).
        The frontend constructs an HTML `<form>` element, appends hidden `csrfToken` and
        `callbackUrl` inputs, and calls `form.submit()` — this is the correct NextAuth v4
        pattern for OAuth from a separate (cross-origin) frontend.

        On success the browser is redirected to Google's consent screen. After the user
        grants consent, Google redirects back to `/api/auth/callback/google` (handled
        internally by NextAuth), which then redirects to `callbackUrl`.

        A rejected sign-in redirects to `${FRONTEND_URL}/auth?error=<code>` instead:
        `google_account_exists`, `google_email_unverified`, `signup_invite_required`
        (invite-only mode: a first Google sign-in whose verified email has no unused
        invite; returning Google users are never gated) or `oauth_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - csrfToken
                - callbackUrl
              properties:
                csrfToken:
                  type: string
                  description: CSRF token obtained from `GET /api/auth/csrf`.
                callbackUrl:
                  type: string
                  format: uri
                  description: >
                    URL that NextAuth will redirect to after a successful Google callback.
                    Must be same-origin as `NEXTAUTH_URL` (i.e. on the API domain).
                    Should be set to `${NEXT_PUBLIC_API_URL}/api/auth/google-token`.
                  example: 'http://localhost:3000/api/auth/google-token'
      responses:
        '302':
          description: Browser redirect to Google OAuth consent screen.
        '403':
          description: Invalid or missing CSRF token.

  /api/auth/google-token:
    get:
      summary: Exchange NextAuth Google session for a custom application JWT
      tags:
        - Authentication (Google OAuth)
      description: |
        **Internal bridge endpoint** — called exclusively by NextAuth as the `callbackUrl`
        after a successful Google OAuth flow. Not intended to be called directly by the
        frontend.

        **Flow:**
        1. Reads the signed NextAuth JWT from the request cookie using `getToken({ req, secret })`.
        2. Validates the token and extracts `token.id` (the application user ID).
        3. Looks up the user record in the database (`prisma.user.findUnique`).
        4. If the browser already holds a live session of the same user (`bliss_rt`, the
           Google step-up for a recent sign-in, #156), that session's sign-in time becomes
           now and a new 15-minute access cookie is issued (the 15-day cap is unchanged).
        5. Otherwise starts a new session: 15-minute access cookie + `bliss_rt` refresh
           cookie. A live session of a different user on this browser is revoked.
        6. Reads the `isNew` flag propagated through the NextAuth JWT callbacks.
        7. Redirects to `${FRONTEND_URL}/auth/callback?isNew=<bool>`.
           The token is NOT in the redirect URL.

        On any failure (no NextAuth token, user not found in DB, exception), the browser is
        redirected to `${FRONTEND_URL}/auth?error=oauth_failed`. Exceptions are captured by
        Sentry.
      security: []
      responses:
        '302':
          description: |
            Browser redirect. Two possible destinations:
            - **Success**: `${FRONTEND_URL}/auth/callback?isNew=<bool>` (JWT in Set-Cookie header, not URL)
            - **Failure**: `${FRONTEND_URL}/auth?error=oauth_failed`
          headers:
            Location:
              description: Redirect target URL (success or error path).
              schema:
                type: string
                format: uri
