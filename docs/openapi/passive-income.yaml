openapi: 3.0.0
info:
  title: Bliss API Layer - Passive Income
  version: 1.0.0
  description: >
    Passive Income Projection (#77): user-entered income terms on assets,
    income streams (Allowance / Government Welfare), detached terms, and the
    projection itself. The projection is computed on request by
    `@bliss/shared/portfolio`'s `project()`; saving terms or streams never
    starts a background job.

    Rates on IncomeTerms (`couponRate`, `spread`, `assumedIndexRate`,
    `yieldPct`, `apyPct`, `annualIndexationPct`) are percentages (5.25 = 5.25%).
    Yields in the projection output (`rateOrYield`, `yieldOnValue`) are
    fractions (0.0525). All amounts are gross.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    IncomeType:
      type: string
      enum: [DIVIDEND, FIXED_COUPON, FLOATING_COUPON, INFLATION_LINKED, RENT, INTEREST, CUSTOM_YIELD, FIXED_AMOUNT, NONE]
    IncomeFrequency:
      type: string
      enum: [WEEKLY, MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, AT_MATURITY]
    IncomeTermsInput:
      type: object
      required: [incomeType]
      description: |
        Required fields per incomeType (skipped when `isDistributing: false` or `incomeType: NONE`):
          - FIXED_COUPON: faceValuePerUnit, couponRate, frequency, maturityDate
          - FLOATING_COUPON: faceValuePerUnit, assumedIndexRate, frequency, maturityDate
          - INFLATION_LINKED: faceValuePerUnit, couponRate, assumedIndexRate, frequency, maturityDate
          - RENT: monthlyRent (net)
          - INTEREST: apyPct
          - CUSTOM_YIELD: yieldPct
          - DIVIDEND (asset): dividendPerUnit or yieldPct
          - FIXED_AMOUNT (streams only): name, amountPerPayment, frequency, currency, startDate
      properties:
        incomeType: { $ref: '#/components/schemas/IncomeType' }
        isDistributing: { type: boolean, default: true }
        frequency: { $ref: '#/components/schemas/IncomeFrequency' }
        currency: { type: string, example: 'BRL', description: 'ISO code. Assets default to the PortfolioItem currency.' }
        anchorPaymentDate: { type: string, format: date, description: 'Any known payment date; schedules are phased on it.' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        name: { type: string, maxLength: 100, description: 'Streams only.' }
        amountPerPayment: { type: number }
        dividendPerUnit: { type: number, description: 'Annual dividend per share/unit (override).' }
        yieldPct: { type: number }
        issuerType: { type: string, enum: [GOVERNMENT, CORPORATE] }
        faceValuePerUnit: { type: number }
        couponRate: { type: number }
        referenceIndex: { type: string, enum: [SOFR, EURIBOR, CDI, SELIC, IPCA, CPI, OTHER] }
        spread: { type: number }
        assumedIndexRate: { type: number }
        maturityDate: { type: string, format: date }
        monthlyRent: { type: number, description: 'Net of costs and vacancy.' }
        leaseEndDate: { type: string, format: date }
        annualIndexationPct: { type: number }
        apyPct: { type: number }
    IncomeTerms:
      allOf:
        - $ref: '#/components/schemas/IncomeTermsInput'
        - type: object
          properties:
            id: { type: integer }
            assetId: { type: integer, nullable: true }
            categoryId: { type: integer, nullable: true }
            orphanedAt: { type: string, format: date-time, nullable: true }
            orphanedLabel: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    IncomeStream:
      allOf:
        - $ref: '#/components/schemas/IncomeTerms'
        - type: object
          properties:
            categoryName: { type: string }
            categoryCode: { type: string, nullable: true }
    Buckets:
      type: object
      properties:
        dividend: { type: number }
        coupon: { type: number }
        rent: { type: number }
        interest: { type: number }
        other: { type: number, description: 'Allowance & benefits (streams).' }
        total: { type: number }
    PassiveIncomeResponse:
      type: object
      properties:
        displayCurrency: { type: string, example: EUR }
        asOf: { type: string, format: date }
        horizon: { type: integer, enum: [12, 24, 36] }
        kpis:
          type: object
          properties:
            next12mIncome: { type: number }
            next12mInvestmentIncome: { type: number }
            next12mOtherIncome: { type: number }
            monthlyAverage: { type: number }
            yieldOnValue: { type: number, nullable: true, description: 'Investment income ÷ value of income-capable assets.' }
            essentialsCoveragePct: { type: number, nullable: true, description: 'next12mIncome ÷ trailing-12-month Essentials spending × 100.' }
            trailingEssentials: { type: number }
            coverage:
              type: object
              description: '"N of M" — counts holding groups since #83 (configured = no holding of the group is missing).'
              properties:
                configured: { type: integer }
                total: { type: integer }
            coverageByHolding:
              type: object
              description: The pre-#83 per-holding count.
              properties:
                configured: { type: integer }
                total: { type: integer }
        actuals:
          type: array
          description: 12 months ending with the current (month-to-date) month; whole "Passive Income" category group.
          items:
            type: object
            properties:
              month: { type: string, example: '2026-09' }
              total: { type: number }
        projected:
          type: array
          description: The next `horizon` full calendar months.
          items:
            allOf:
              - $ref: '#/components/schemas/Buckets'
              - type: object
                properties:
                  month: { type: string, example: '2026-10' }
        yearly:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Buckets'
              - type: object
                properties:
                  year: { type: integer, example: 1 }
        items:
          type: array
          description: One row per holding (symbol × account) and per stream — unchanged by #83.
          items: { $ref: '#/components/schemas/PassiveIncomeItem' }
        groups:
          type: array
          description: >
            #83 — one row per symbol + asset class (cash therefore per currency),
            sorted by horizonTotal. Streams are not grouped.
          items: { $ref: '#/components/schemas/PassiveIncomeGroup' }
        upcomingPayments:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              date: { type: string, format: date }
              kind: { type: string, enum: [ASSET, STREAM] }
              refId: { type: integer }
              label: { type: string }
              amount: { type: number }
              source: { type: string, enum: [dividend, coupon, rent, interest, other] }
        upcomingPaymentsGrouped:
          type: array
          maxItems: 10
          description: '#83 — the same symbol, date and source merged into one line before the top 10 is taken; streams stay one line each.'
          items:
            type: object
            properties:
              date: { type: string, format: date }
              kind: { type: string, enum: [ASSET, STREAM] }
              groupKey: { type: string, nullable: true, description: 'The symbol (null for streams).' }
              refId: { type: integer, nullable: true, description: 'Stream id (null for holdings).' }
              refIds: { type: array, items: { type: integer } }
              label: { type: string }
              amount: { type: number }
              source: { type: string, enum: [dividend, coupon, rent, interest, other] }
              accounts: { type: array, items: { type: string } }
        maturityLadder:
          type: array
          description: Bond principal returning per year within the horizon (not income).
          items:
            type: object
            properties:
              year: { type: integer }
              principal: { type: number }
              items: { type: array, items: { type: integer } }
        detached:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              orphanedLabel: { type: string }
              orphanedAt: { type: string, format: date-time }
              incomeType: { $ref: '#/components/schemas/IncomeType' }
        missing:
          type: array
          items:
            type: object
            properties:
              portfolioItemId: { type: integer }
              symbol: { type: string }
              label: { type: string }
              assetClass: { type: string, enum: [STOCK, ETF, FUND, BOND, REAL_ESTATE] }
              reason: { type: string, enum: [NO_TERMS, UNTRUSTED_DIVIDEND] }
              accountName: { type: string, nullable: true }
        missingGroups:
          type: array
          description: '#83 — one entry per symbol (NO_TERMS wins over UNTRUSTED_DIVIDEND).'
          items:
            type: object
            properties:
              groupKey: { type: string }
              symbol: { type: string }
              label: { type: string }
              assetClass: { type: string, enum: [STOCK, ETF, FUND, BOND, REAL_ESTATE] }
              portfolioItemIds: { type: array, items: { type: integer } }
              reason: { type: string, enum: [NO_TERMS, UNTRUSTED_DIVIDEND] }
    PassiveIncomeItem:
      type: object
      properties:
        kind: { type: string, enum: [ASSET, STREAM] }
        portfolioItemId: { type: integer, nullable: true }
        streamId: { type: integer, nullable: true }
        label: { type: string }
        symbol: { type: string, nullable: true }
        securityName: { type: string, nullable: true, description: '#83 — SecurityMaster name.' }
        assetClass: { type: string, nullable: true, enum: [STOCK, ETF, FUND, BOND, REAL_ESTATE, CASH, OTHER] }
        accountId: { type: integer, nullable: true, description: '#83' }
        accountName: { type: string, nullable: true, description: '#83' }
        quantity: { type: number, nullable: true, description: '#83' }
        currentValue: { type: number, nullable: true, description: '#83 — display currency.' }
        currency: { type: string, nullable: true, description: "#83 — the holding's own currency." }
        incomeType: { $ref: '#/components/schemas/IncomeType' }
        source: { type: string, enum: [AUTO, OVERRIDE, MANUAL, MISSING], description: 'MISSING only on group children.' }
        rateOrYield: { type: number, nullable: true }
        amountPerPayment: { type: number, nullable: true }
        frequency: { type: string, description: 'IncomeFrequency, or IRREGULAR / NONE for automatic dividends.' }
        nextPaymentDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [OK, MATURED_UNREDEEMED, ENDED, STALE_RATE] }
        horizonTotal: { type: number }
        next12mTotal: { type: number }
    PassiveIncomeGroup:
      type: object
      properties:
        groupKey: { type: string, example: GOOG, description: The symbol. }
        kind: { type: string, enum: [SECURITY, CASH] }
        label: { type: string, example: Alphabet Inc. }
        symbol: { type: string }
        assetClass: { type: string, enum: [STOCK, ETF, FUND, BOND, REAL_ESTATE, CASH, OTHER] }
        accountCount: { type: integer }
        portfolioItemIds: { type: array, items: { type: integer } }
        quantity: { type: number }
        currentValue: { type: number }
        currency: { type: string, nullable: true, description: 'Shared currency or MIXED.' }
        incomeType: { type: string, description: 'Shared IncomeType or MIXED.' }
        source: { type: string, enum: [AUTO, OVERRIDE, MANUAL, MISSING, MIXED] }
        frequency: { type: string, nullable: true, description: 'Shared frequency or MIXED.' }
        rateOrYield: { type: number, nullable: true, description: 'Next-12-month income ÷ value; bonds/cash: the shared rate.' }
        rateRange: { type: array, nullable: true, items: { type: number }, minItems: 2, maxItems: 2, description: 'Bonds/cash whose accounts differ.' }
        amountPerPayment: { type: number, nullable: true }
        nextPaymentDate: { type: string, format: date, nullable: true, description: Earliest among the holdings. }
        endDate: { type: string, format: date, nullable: true, description: Latest among the holdings. }
        status: { type: string, enum: [OK, MATURED_UNREDEEMED, ENDED, STALE_RATE], description: Most severe among the holdings. }
        statusCount: { type: integer, description: Holdings whose status is not OK. }
        configured: { type: boolean, description: No holding is missing income data. }
        inCoverage: { type: boolean }
        horizonTotal: { type: number }
        next12mTotal: { type: number }
        children: { type: array, items: { $ref: '#/components/schemas/PassiveIncomeItem' } }
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: array, items: { type: object } }

security:
  - cookieAuth: []

paths:
  /api/portfolio/passive-income:
    get:
      tags: [Passive Income]
      summary: Passive income projection
      parameters:
        - name: horizon
          in: query
          schema: { type: integer, enum: [12, 24, 36], default: 12 }
      responses:
        '200':
          description: Projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassiveIncomeResponse' }
        '400': { description: 'Invalid horizon', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized }

  /api/portfolio/items/{assetId}/income-terms:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Passive Income]
      summary: Get an asset's income terms and automatic dividend data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    type: object
                    properties:
                      id: { type: integer }
                      symbol: { type: string }
                      currency: { type: string }
                      quantity: { type: number }
                      categoryName: { type: string }
                      assetClass: { type: string, nullable: true, enum: [STOCK, ETF, FUND, BOND, REAL_ESTATE, CASH, OTHER] }
                      defaultIncomeType: { $ref: '#/components/schemas/IncomeType' }
                  terms: { $ref: '#/components/schemas/IncomeTerms' }
                  siblings:
                    type: array
                    description: >
                      #83 — every open holding (quantity > 0, plus this one) of the same
                      symbol and asset class in the tenant, for group editing.
                    items:
                      type: object
                      properties:
                        assetId: { type: integer }
                        accountName: { type: string, nullable: true }
                        currency: { type: string }
                        quantity: { type: number }
                        costBasis: { type: number, nullable: true }
                        terms: { $ref: '#/components/schemas/IncomeTerms' }
                        source: { type: string, enum: [AUTO, OVERRIDE, MANUAL, MISSING] }
                  auto:
                    type: object
                    nullable: true
                    description: Present only when SecurityMaster marks the dividend data trusted.
                    properties:
                      recentDividends:
                        type: array
                        items:
                          type: object
                          properties:
                            exDate: { type: string, format: date }
                            amount: { type: number }
                      frequency: { type: string }
                      annualDividend: { type: number, nullable: true }
                      dividendYield: { type: number, nullable: true }
        '404': { description: Not found in this tenant }
    put:
      tags: [Passive Income]
      summary: Upsert an asset's income terms
      description: >
        Validated per incomeType. `applyToSymbol: true` writes the same terms to
        every open holding of the tenant with that symbol and asset class, in one
        transaction, for every income type except INTEREST (cash APY is set per
        account → 400). Without a body `currency`, each holding keeps its own.
        Crypto, collectibles, vehicles, commodities and debt cannot hold income terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IncomeTermsInput'
                - type: object
                  properties:
                    applyToSymbol: { type: boolean }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  terms: { $ref: '#/components/schemas/IncomeTerms' }
                  appliedTo: { type: array, items: { type: integer } }
        '400': { description: 'Validation error, asset cannot hold income terms, or applyToSymbol with cash interest' }
        '404': { description: Not found in this tenant }
    delete:
      tags: [Passive Income]
      summary: Remove an asset's income terms (stocks/ETFs fall back to automatic data)
      parameters:
        - name: applyToSymbol
          in: query
          description: '#83 — remove from every holding of the symbol with the same asset class (not for cash).'
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: Removed from every holding of the symbol (applyToSymbol=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        '204': { description: Deleted }
        '400': { description: applyToSymbol on a cash holding }
        '404': { description: No terms / not found in this tenant }

  /api/passive-income/streams:
    get:
      tags: [Passive Income]
      summary: List income streams and the categories eligible for streams
      description: >
        Eligible categories are Income categories in the "Passive Income" group that
        no asset produces (no processingHint, IGNORE key strategy, not Dividends /
        Bond Income / Interest Income / Rent Income / Options Income) — in practice
        Allowance, Government Welfare and custom categories.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  streams: { type: array, items: { $ref: '#/components/schemas/IncomeStream' } }
                  eligibleCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        defaultCategoryCode: { type: string, nullable: true }
    post:
      tags: [Passive Income]
      summary: Create an income stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IncomeTermsInput'
                - type: object
                  required: [categoryId]
                  properties:
                    categoryId: { type: integer }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IncomeStream' } } } }
        '400': { description: Validation error or ineligible category }

  /api/passive-income/streams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Passive Income]
      summary: Update an income stream
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeTermsInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/IncomeStream' } } } }
        '400': { description: Validation error }
        '404': { description: Not found in this tenant }
    delete:
      tags: [Passive Income]
      summary: Delete an income stream
      responses:
        '204': { description: Deleted }
        '404': { description: Not found in this tenant }

  /api/portfolio/income-terms/detached:
    get:
      tags: [Passive Income]
      summary: List detached income terms
      description: >
        Terms kept when a portfolio rebuild pruned their asset because its key
        changed (a corrected import) and no single clear replacement existed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  detached: { type: array, items: { $ref: '#/components/schemas/IncomeTerms' } }

  /api/portfolio/income-terms/{id}/attach:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Passive Income]
      summary: Re-attach detached income terms to an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: integer }
      responses:
        '200': { description: Attached }
        '404': { description: Terms or asset not found in this tenant }
        '409': { description: Terms not detached, or the asset already has terms }

  /api/portfolio/income-terms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Passive Income]
      summary: Discard detached income terms (only while detached)
      responses:
        '204': { description: Deleted }
        '404': { description: Not found in this tenant }
        '409': { description: Terms are attached }
