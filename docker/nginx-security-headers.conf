# Security headers for every response of the web app (#78 R7).
# Included in each `location` of nginx.conf: an add_header inside a location
# replaces, never adds to, the outer ones, so a location that sets its own
# Cache-Control would otherwise drop these.
#  - framing: the SPA and the OAuth consent page must never render inside a
#    cross-origin frame (clickjacking the consent "Approve" button)
#  - nosniff / referrer: no MIME sniffing; no full URLs (with ?query) leaking
#    to other origins
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
