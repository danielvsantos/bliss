server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets aggressively (Vite hashes filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Installable PWA (#155): the entry points of the app must always be
    # revalidated, or an installed app can stay on an old build. `no-cache`
    # still allows a 304. Exact matches win over the prefix locations below.
    # (add_header in a location replaces, never adds to, outer add_headers.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Home-screen icons: not content-hashed, but they only change with the mascot.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback — all routes served by index.html. No `$uri/`: a route that
    # shares a name with a directory in dist/ must still get the SPA, not a 403.
    # no-cache because every fallback response is index.html (#155).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
